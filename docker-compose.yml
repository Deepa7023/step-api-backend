version: "3.8"

services:
  step-api:
    build:
      context: .
    container_name: step-api-backend
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "development"
    volumes:
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
